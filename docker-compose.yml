services:
  work-order:
    build: .
    container_name: work-order
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html

work-order-nginx:
    image: nginx:alpine
    container_name: work-order-nginx
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel
