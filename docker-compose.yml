version: '3.9'

networks:
  laravel:
    driver: bridge

services:

  php:
    build: .
    container_name: work-order-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel

  work-order-nginx:
    image: nginx:alpine
    container_name: work-order-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - laravel
